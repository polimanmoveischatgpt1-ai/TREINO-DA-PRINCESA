<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Gym</title><style>
:root{--b:#0b0d12;--c:#151924;--c2:#1c2130;--l:#2a3142;--t:#f5f7fb;--m:#8c96aa;--a:#4f7cff;--p:#8b5cf6;--d:#ef6374;--g:#f2bd51}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b0d12,#090b10);color:var(--t);font:14px system-ui,-apple-system,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{border:0}input,textarea,select{width:100%;background:#0e1118;border:1px solid var(--l);border-radius:12px;padding:11px;outline:none}.app{max-width:760px;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;z-index:9;background:#0b0d12ee;border-bottom:1px solid #202635;padding:14px 16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--p));display:grid;place-items:center;font-size:20px;font-weight:900}.brand h1{margin:0;font-size:22px}.mut{color:var(--m)}.sm{font-size:11px}.page{display:none;padding:14px}.page.on{display:block}.hero,.card,.work,.ex{background:linear-gradient(180deg,var(--c),#11151e);border:1px solid var(--l);border-radius:20px;padding:15px;margin-bottom:10px}.hero{padding:20px;background:linear-gradient(135deg,#161c2b,#191629)}h2,h3{margin:0}.hero h2{font-size:26px;margin:6px 0}.ey{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#aebcff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--c);border:1px solid var(--l);border-radius:17px;padding:12px}.stat b{display:block;font-size:21px;margin-top:4px}.title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px}.btn{border-radius:12px;padding:10px 12px;font-weight:800;background:#252b3a}.pri{background:linear-gradient(135deg,var(--a),#6658ed)}.ghost{border:1px solid var(--l);background:transparent}.danger{background:#351820;color:#ff8998;border:1px solid #592631}.full{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.worktop{display:flex;gap:10px;align-items:center}.badge{width:45px;height:45px;border-radius:14px;background:#202b4c;color:#b8c5ff;display:grid;place-items:center;font-weight:900;font-size:18px}.grow{flex:1}.work h3{margin-bottom:3px}.actions{display:flex;gap:7px;margin-top:11px}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;height:70px;display:grid;grid-template-columns:repeat(5,1fr);background:#0c0f16f4;border-top:1px solid #222838}.nav button{background:transparent;color:#737e91;font-size:10px}.nav span{display:block;font-size:19px}.nav .on{color:#94adff;font-weight:800}.sessionHead{margin-bottom:12px}.bar{height:8px;border-radius:99px;background:#272d3b;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--p))}.extop{display:flex;gap:9px}.n{width:30px;height:30px;border-radius:10px;background:#202a49;color:#b7c5ff;display:grid;place-items:center;font-weight:900}.last{margin:9px 0;padding:8px;background:#0e1118;border:1px solid #252b38;border-radius:11px;font-size:11px;color:#aeb5c5}.sets,.set{display:grid;grid-template-columns:38px 1fr 1fr 42px;gap:6px;align-items:center}.sets{font-size:9px;color:#7f899c;text-align:center;margin:8px 0 4px}.set{margin-bottom:6px}.set input{text-align:center;padding:9px}.done{width:40px;height:40px;border-radius:12px;background:#202532;border:1px solid #343c4d;color:#7d879a}.done.on{background:linear-gradient(135deg,var(--a),var(--p));color:white}.hint{font-size:11px;color:#bac7ff;background:#17213a;border:1px solid #2d416c;border-radius:11px;padding:8px;margin-top:8px}.timer{display:none;position:fixed;z-index:25;bottom:76px;left:50%;transform:translateX(-50%);width:min(742px,calc(100% - 16px));background:#171c28f4;border:1px solid #39425a;border-radius:17px;padding:9px;align-items:center;gap:7px}.timer.on{display:flex}.clock{font-size:20px;font-weight:900}.timer .btn{font-size:11px;padding:8px}.hist{padding:11px 0;border-bottom:1px solid #252b38}.hist:last-child{border:0}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{padding:4px 7px;border-radius:99px;background:#20283a;border:1px solid #313a51;color:#b9c6f0;font-size:10px}.chart{height:190px}.chart canvas{width:100%;height:100%}.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #252b38}.switch input{display:none}.sw{width:46px;height:27px;border-radius:99px;background:#2b3140;display:block;position:relative}.sw:after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#d8dce5;transition:.2s}.switch input:checked+.sw{background:linear-gradient(90deg,var(--a),var(--p))}.switch input:checked+.sw:after{left:22px;background:white}.modal{display:none;position:fixed;inset:0;z-index:40;background:#000a;align-items:flex-end}.modal.on{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;margin:auto;background:#10131b;border:1px solid #303748;border-radius:24px 24px 0 0;padding:16px}.editex{background:#171b25;border:1px solid #2a3140;border-radius:15px;padding:11px;margin:8px 0}label{display:block;color:#939caf;font-size:10px;font-weight:700;margin:8px 0 4px}.toast{position:fixed;z-index:50;bottom:150px;left:50%;transform:translate(-50%,15px);opacity:0;background:#232a39;border:1px solid #3b455c;padding:9px 13px;border-radius:12px;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}.empty{text-align:center;color:#6e7789;padding:24px}.gold{color:#ffd36d}.hidden{display:none!important}@media(max-width:420px){.page{padding:12px}.sets,.set{grid-template-columns:34px 1fr 1fr 40px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">G</div><div><h1>Gym</h1><div class="mut sm">Treino, progresso e consistência.</div></div></div></header><main><section id="home" class="page on"></section><section id="workouts" class="page"></section><section id="session" class="page"></section><section id="history" class="page"></section><section id="progress" class="page"></section><section id="settings" class="page"></section></main></div><nav id="nav" class="nav"><button class="on" data-p="home" onclick="go('home')"><span>⌂</span>Início</button><button data-p="workouts" onclick="go('workouts')"><span>◫</span>Treinos</button><button data-p="history" onclick="go('history')"><span>↺</span>Histórico</button><button data-p="progress" onclick="go('progress')"><span>↗</span>Progresso</button><button data-p="settings" onclick="go('settings')"><span>⚙</span>Ajustes</button></nav><div id="timer" class="timer"><div class="grow"><div id="tl" class="mut sm">Descanso</div><div id="tc" class="clock">01:30</div></div><button class="btn" onclick="addTime(15)">+15</button><button id="tp" class="btn" onclick="pauseResume()">Pausar</button><button class="btn ghost" onclick="cancelTimer()">×</button></div><div id="toast" class="toast"></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div><script>
const K='gym_data_v1',q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],cl=x=>JSON.parse(JSON.stringify(x)),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const BASE=[{id:'A',name:'Treino A',focus:'Peito • Ombros • Tríceps',e:[['Supino Inclinado',4,'6-8',120],['Supino Reto',3,'8-10',120],['Desenvolvimento',3,'8-10',105],['Elevação Lateral',3,'12-15',75],['Tríceps Polia',3,'8-10',75],['Tríceps Francês',2,'10-12',75]]},{id:'B',name:'Treino B',focus:'Costas • Bíceps',e:[['Barra Fixa',4,'6-10',120],['Remada Curvada',3,'8-10',120],['Remada Baixa',3,'10-12',90],['Crucifixo Inverso',3,'12-15',75],['Rosca Direta',3,'8-10',90],['Rosca Martelo',2,'10-12',75]]},{id:'C',name:'Treino C',focus:'Pernas • Abdômen',e:[['Agachamento Smith',3,'8-10',150],['Mesa Flexora',3,'10-12',90],['Extensora',3,'10-12',90],['Stiff',3,'8-10',120],['Panturrilha',4,'12-15',75],['Abdômen',3,'12-15',60]]}];
function defaults(){return{workouts:BASE.map(w=>({id:w.id,name:w.name,focus:w.focus,exercises:w.e.map((e,i)=>({id:w.id+i,name:e[0],sets:e[1],reps:e[2],rest:e[3]}))})),history:[],body:[],active:null,settings:{auto:true,vib:true,sound:true,screen:true,rest:90}}}function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x&&x.workouts)return Object.assign(defaults(),x,{settings:Object.assign(defaults().settings,x.settings||{})})}catch(e){}return defaults()}let S=load(),edit=null,timer={active:false,running:false,remainingMs:0,label:''};function save(){localStorage.setItem(K,JSON.stringify(S))}function msg(s){let e=q('#toast');e.textContent=s;e.classList.add('on');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('on'),1600)}function native(){return typeof GymNative!=='undefined'}function ftime(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function fdate(x){return new Date(x).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}function vol(h){return Math.round((h.exercises||[]).reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.done?(+s.kg||0)*(+s.reps||0):0),0),0))}function doneSets(h){return(h.exercises||[]).reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}function lastEx(name){for(let h of S.history)for(let e of h.exercises||[])if(e.name.toLowerCase()===name.toLowerCase())return e;return null}function best(name){let b=0;for(let h of S.history)for(let e of h.exercises||[])if(e.name.toLowerCase()===name.toLowerCase())for(let s of e.sets)if(s.done)b=Math.max(b,+s.kg||0);return b}function next(){if(!S.workouts.length)return null;if(!S.history.length)return S.workouts[0];let i=S.workouts.findIndex(w=>w.id===S.history[0].workoutId);return S.workouts[(i<0?0:i+1)%S.workouts.length]}
function go(p){qa('.page').forEach(x=>x.classList.toggle('on',x.id===p));qa('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===p));q('#nav').classList.toggle('hidden',p==='session');render(p);scrollTo(0,0)}function render(p){if(p==='home')home();if(p==='workouts')workouts();if(p==='session')session();if(p==='history')history();if(p==='progress')progress();if(p==='settings')settings()}
function home(){let n=next(),week=S.history.filter(h=>Date.now()-new Date(h.date)<7*864e5),v=week.reduce((a,h)=>a+vol(h),0);q('#home').innerHTML=`<div class="hero"><div class="ey">PAINEL DE TREINO</div><h2>${n?'Próximo: '+esc(n.name):'Monte seu treino'}</h2><div class="mut">${n?esc(n.focus):'Crie um treino para começar.'}</div>${n?`<button class="btn pri" style="margin-top:13px" onclick="start('${n.id}')">▶ Iniciar treino</button>`:''}</div><div class="grid"><div class="stat"><div class="mut sm">Últimos 7 dias</div><b>${week.length}</b><span class="mut sm">treinos</span></div><div class="stat"><div class="mut sm">Volume</div><b>${v.toLocaleString('pt-BR')}</b><span class="mut sm">kg × rep</span></div><div class="stat"><div class="mut sm">Histórico</div><b>${S.history.length}</b><span class="mut sm">sessões</span></div><div class="stat"><div class="mut sm">Treinos</div><b>${S.workouts.length}</b><span class="mut sm">programados</span></div></div><div class="title"><h3>Programa</h3><button class="btn ghost" onclick="go('workouts')">Editar</button></div>${S.workouts.slice(0,3).map((w,i)=>cardW(w,i,true)).join('')}`}
function cardW(w,i,small=false){return`<div class="work"><div class="worktop"><div class="badge">${esc(w.id.length<3?w.id:i+1)}</div><div class="grow"><h3>${esc(w.name)}</h3><div class="mut sm">${esc(w.focus)} • ${w.exercises.length} exercícios</div></div></div><div class="actions"><button class="btn pri" onclick="start('${w.id}')">▶ Iniciar</button>${small?'':`<button class="btn" onclick="openEdit('${w.id}')">Editar</button><button class="btn ghost" onclick="dup('${w.id}')">Duplicar</button>`}</div></div>`}function workouts(){q('#workouts').innerHTML=`<div class="title" style="margin-top:2px"><div><div class="ey">PROGRAMA</div><h2>Meus treinos</h2></div><button class="btn pri" onclick="openEdit('')">+ Novo</button></div>${S.workouts.map(cardW).join('')||'<div class="empty">Nenhum treino.</div>'}`}
function newSession(w){return{id:'S'+Date.now(),workoutId:w.id,workoutName:w.name,focus:w.focus,date:new Date().toISOString(),started:Date.now(),exercises:w.exercises.map(e=>({id:e.id,name:e.name,target:e.reps,rest:e.rest,sets:Array.from({length:e.sets},()=>({kg:'',reps:'',done:false}))}))}}function start(id){let w=S.workouts.find(x=>x.id===id);if(!w)return;if(S.active&&S.active.workoutId!==id&&!confirm('Substituir o treino em andamento?'))return;if(!S.active||S.active.workoutId!==id)S.active=newSession(w);save();if(native()&&S.settings.screen)GymNative.keepScreenOn(true);go('session')}
function session(){let a=S.active;if(!a)return go('workouts');let d=doneSets(a),all=a.exercises.reduce((n,e)=>n+e.sets.length,0);q('#session').innerHTML=`<button class="btn ghost" onclick="leave()">← Voltar</button><div class="sessionHead"><div class="ey" style="margin-top:12px">TREINO EM ANDAMENTO</div><h2>${esc(a.workoutName)}</h2><div class="mut sm">${esc(a.focus)} • ${d}/${all} séries</div><div class="bar" style="margin-top:9px"><div class="fill" style="width:${all?d/all*100:0}%"></div></div></div>${a.exercises.map(exCard).join('')}<div class="card"><label>Observação</label><textarea oninput="S.active.note=this.value;save()" placeholder="Como foi o treino?">${esc(a.note||'')}</textarea><button class="btn pri full" style="margin-top:9px" onclick="finish()">✓ Finalizar treino</button></div>`}
function exCard(e,i){let l=lastEx(e.name),b=best(e.name),lt=l?l.sets.filter(s=>s.done).map(s=>`${s.kg||0}kg×${s.reps||0}`).join(' · '):'Sem registro anterior';let nums=String(e.target).match(/\d+/g)||[],mx=+(nums.at(-1)||0),top=e.sets.every(s=>s.done&&(+s.reps||0)>=mx);return`<div class="ex"><div class="extop"><div class="n">${i+1}</div><div class="grow"><h3>${esc(e.name)}</h3><div class="mut sm">${e.sets.length} séries • ${esc(e.target)} reps • ${ftime(e.rest)}</div></div>${b?`<span class="chip gold">PR ${b}kg</span>`:''}</div><div class="last">Último: ${esc(lt)}</div><div class="sets"><div>SÉRIE</div><div>KG</div><div>REPS</div><div>OK</div></div>${e.sets.map((s,j)=>`<div class="set"><div class="mut sm" style="text-align:center">${j+1}</div><input inputmode="decimal" value="${esc(s.kg)}" oninput="sv(${i},${j},'kg',this.value)" placeholder="0"><input inputmode="numeric" value="${esc(s.reps)}" oninput="sv(${i},${j},'reps',this.value)" placeholder="0"><button class="done ${s.done?'on':''}" onclick="td(${i},${j})">${s.done?'✓':'○'}</button></div>`).join('')}<div class="row"><button class="btn" onclick="rest(${e.rest},'${esc(e.name)}')">⏱ ${ftime(e.rest)}</button><button class="btn ghost" onclick="useLast(${i})">Usar último</button></div>${top?'<div class="hint">↗ Topo da faixa atingido em todas as séries. Considere pequeno aumento de carga na próxima sessão.</div>':''}</div>`}function sv(i,j,k,v){S.active.exercises[i].sets[j][k]=v;save()}function td(i,j){let s=S.active.exercises[i].sets[j];s.done=!s.done;save();if(s.done){if(native())GymNative.vibrate(35);let e=S.active.exercises[i];if(S.settings.auto)rest(e.rest,e.name)}session()}function useLast(i){let e=S.active.exercises[i],l=lastEx(e.name);if(!l)return msg('Sem registro anterior');let z=l.sets.filter(s=>s.done);e.sets.forEach((s,j)=>{let x=z[Math.min(j,z.length-1)];if(x){s.kg=x.kg;s.reps=x.reps}});save();session()}function leave(){if(native())GymNative.keepScreenOn(false);go('workouts')}function finish(){let a=S.active;if(!a)return;if(!doneSets(a)&&!confirm('Finalizar sem séries concluídas?'))return;a.duration=Math.round((Date.now()-a.started)/1000);S.history.unshift(a);S.history=S.history.slice(0,500);S.active=null;save();if(native()){GymNative.keepScreenOn(false);GymNative.cancelTimer()}msg('Treino salvo');go('history')}
function dup(id){let w=cl(S.workouts.find(x=>x.id===id));w.id='W'+Date.now().toString(36);w.name+=' cópia';w.exercises.forEach(e=>e.id='E'+Math.random().toString(36).slice(2));S.workouts.push(w);save();workouts()}function openEdit(id){edit=id?cl(S.workouts.find(x=>x.id===id)):{id:'W'+Date.now().toString(36),name:'Novo treino',focus:'Personalizado',exercises:[]};drawEdit()}function drawEdit(){q('#sheet').innerHTML=`<div class="row"><h2 class="grow">${S.workouts.some(w=>w.id===edit.id)?'Editar':'Novo'} treino</h2><button class="btn ghost" onclick="closeModal()">Fechar</button></div><label>Nome</label><input id="en" value="${esc(edit.name)}"><label>Foco</label><input id="ef" value="${esc(edit.focus)}"><div class="title"><h3>Exercícios</h3><button class="btn" onclick="addEx()">+ Exercício</button></div><div id="elist">${edit.exercises.map(edEx).join('')||'<div class="empty">Adicione exercícios.</div>'}</div><button class="btn pri full" onclick="saveEdit()">Salvar treino</button>${S.workouts.some(w=>w.id===edit.id)?'<button class="btn danger full" style="margin-top:7px" onclick="delW()">Excluir treino</button>':''}`;q('#modal').classList.add('on')}function edEx(e,i){return`<div class="editex" data-i="${i}"><label>Exercício ${i+1}</label><input data-f="name" value="${esc(e.name)}"><div class="row"><div><label>Séries</label><input data-f="sets" type="number" value="${e.sets}"></div><div><label>Reps</label><input data-f="reps" value="${esc(e.reps)}"></div></div><label>Descanso (s)</label><input data-f="rest" type="number" step="15" value="${e.rest}"><div class="actions"><button class="btn ghost" onclick="moveEx(${i},-1)">↑</button><button class="btn ghost" onclick="moveEx(${i},1)">↓</button><button class="btn danger" onclick="rmEx(${i})">Excluir</button></div></div>`}function sync(){edit.name=q('#en')?.value.trim()||'Treino';edit.focus=q('#ef')?.value.trim()||'Personalizado';qa('#elist .editex').forEach(x=>{let e=edit.exercises[+x.dataset.i];e.name=x.querySelector('[data-f=name]').value.trim()||'Exercício';e.sets=Math.max(1,+x.querySelector('[data-f=sets]').value||1);e.reps=x.querySelector('[data-f=reps]').value.trim()||'8-12';e.rest=Math.max(15,+x.querySelector('[data-f=rest]').value||90)})}function addEx(){sync();edit.exercises.push({id:'E'+Math.random().toString(36).slice(2),name:'Novo exercício',sets:3,reps:'8-12',rest:S.settings.rest});drawEdit()}function rmEx(i){sync();edit.exercises.splice(i,1);drawEdit()}function moveEx(i,d){sync();let j=i+d;if(j<0||j>=edit.exercises.length)return;[edit.exercises[i],edit.exercises[j]]=[edit.exercises[j],edit.exercises[i]];drawEdit()}function saveEdit(){sync();let i=S.workouts.findIndex(w=>w.id===edit.id);if(i>=0)S.workouts[i]=edit;else S.workouts.push(edit);save();closeModal();workouts();msg('Treino salvo')}function delW(){if(!confirm('Excluir treino? O histórico será mantido.'))return;S.workouts=S.workouts.filter(w=>w.id!==edit.id);save();closeModal();workouts()}function closeModal(){q('#modal').classList.remove('on')}
function history(){q('#history').innerHTML=`<div class="title" style="margin-top:2px"><div><div class="ey">REGISTROS</div><h2>Histórico</h2></div><span class="chip">${S.history.length}</span></div><div class="card">${S.history.length?S.history.map((h,i)=>`<div class="hist"><div class="row"><div><b>${esc(h.workoutName)}</b><div class="mut sm">${fdate(h.date)}</div></div><div style="text-align:right"><b>${Math.round((h.duration||0)/60)} min</b><div class="mut sm">${vol(h).toLocaleString('pt-BR')} vol.</div></div></div><div class="chips"><span class="chip">${doneSets(h)} séries</span><button class="chip" onclick="details(${i})">Detalhes</button></div></div>`).join(''):'<div class="empty">Nenhum treino concluído.</div>'}</div>`}function details(i){let h=S.history[i];q('#sheet').innerHTML=`<div class="row"><div class="grow"><div class="ey">${fdate(h.date)}</div><h2>${esc(h.workoutName)}</h2></div><button class="btn ghost" onclick="closeModal()">Fechar</button></div>${h.exercises.map(e=>`<div class="editex"><b>${esc(e.name)}</b><div class="chips">${e.sets.filter(s=>s.done).map((s,j)=>`<span class="chip">S${j+1}: ${esc(s.kg||0)}kg × ${esc(s.reps||0)}</span>`).join('')||'<span class="mut sm">Sem série concluída</span>'}</div></div>`).join('')}<button class="btn danger full" onclick="delHist(${i})">Excluir registro</button>`;q('#modal').classList.add('on')}function delHist(i){if(!confirm('Excluir este registro?'))return;S.history.splice(i,1);save();closeModal();history()}
function names(){return[...new Set(S.workouts.flatMap(w=>w.exercises.map(e=>e.name)).concat(S.history.flatMap(h=>h.exercises.map(e=>e.name))))]}function progress(){let ns=names(),sel=localStorage.getItem('px')||ns[0]||'',rec=records(sel),bl=best(sel);q('#progress').innerHTML=`<div class="title" style="margin-top:2px"><div><div class="ey">EVOLUÇÃO</div><h2>Progresso</h2></div></div><div class="card"><label>Exercício</label><select onchange="localStorage.setItem('px',this.value);progress()">${ns.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select><div class="grid" style="margin-top:12px"><div class="stat"><div class="mut sm">Maior carga</div><b>${bl||'—'}${bl?' kg':''}</b></div><div class="stat"><div class="mut sm">Registros</div><b>${rec.length}</b></div></div><div class="chart"><canvas id="ch"></canvas></div></div><div class="title"><h3>Peso e medidas</h3></div><div class="card"><div class="row"><div><label>Peso kg</label><input id="bw" type="number" step=".1"></div><div><label>Cintura cm</label><input id="bc" type="number" step=".1"></div></div><div class="row"><div><label>Braço cm</label><input id="bb" type="number" step=".1"></div><div><label>Coxa cm</label><input id="bt" type="number" step=".1"></div></div><button class="btn pri full" style="margin-top:9px" onclick="body()">Salvar medição</button></div><div class="card">${S.body.slice(0,8).map(x=>`<div class="hist"><b>${x.weight?x.weight+' kg':'Medição'}</b><span class="mut sm" style="float:right">${fdate(x.date)}</span><div class="chips">${x.waist?`<span class="chip">Cintura ${x.waist}</span>`:''}${x.arm?`<span class="chip">Braço ${x.arm}</span>`:''}${x.thigh?`<span class="chip">Coxa ${x.thigh}</span>`:''}</div></div>`).join('')||'<div class="empty">Sem medições.</div>'}</div>`;setTimeout(()=>chart(rec),10)}function records(name){let r=[];S.history.slice().reverse().forEach(h=>h.exercises.forEach(e=>{if(e.name===name){let x=Math.max(0,...e.sets.filter(s=>s.done).map(s=>+s.kg||0));if(x)r.push({x:fdate(h.date),y:x})}}));return r.slice(-12)}function chart(r){let c=q('#ch');if(!c)return,ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.scale(d,d);ctx.strokeStyle='#293247';for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(10,h*i/5);ctx.lineTo(w-10,h*i/5);ctx.stroke()}if(!r.length){ctx.fillStyle='#788296';ctx.textAlign='center';ctx.fillText('Registre cargas para ver evolução',w/2,h/2);return}let mx=Math.max(...r.map(x=>x.y))*1.1,mn=Math.min(...r.map(x=>x.y))*.9,rg=Math.max(1,mx-mn),p=r.map((x,i)=>({x:18+(w-36)*(r.length===1?.5:i/(r.length-1)),y:h-18-(h-36)*(x.y-mn)/rg}));ctx.strokeStyle='#678bff';ctx.lineWidth=3;ctx.beginPath();p.forEach((x,i)=>i?ctx.lineTo(x.x,x.y):ctx.moveTo(x.x,x.y));ctx.stroke();ctx.fillStyle='#a887ff';p.forEach(x=>{ctx.beginPath();ctx.arc(x.x,x.y,4,0,7);ctx.fill()})}function body(){let x={date:new Date().toISOString(),weight:q('#bw').value,waist:q('#bc').value,arm:q('#bb').value,thigh:q('#bt').value};if(!x.weight&&!x.waist&&!x.arm&&!x.thigh)return msg('Preencha uma medida');S.body.unshift(x);save();progress()}
function tog(k,v){return`<label class="switch"><input type="checkbox" ${v?'checked':''} onchange="S.settings.${k}=this.checked;save()"><span class="sw"></span></label>`}function settings(){let s=S.settings;q('#settings').innerHTML=`<div class="title" style="margin-top:2px"><div><div class="ey">PREFERÊNCIAS</div><h2>Ajustes</h2></div></div><div class="card"><div class="toggle"><div><b>Descanso automático</b><div class="mut sm">Ao concluir série.</div></div>${tog('auto',s.auto)}</div><div class="toggle"><div><b>Vibração</b><div class="mut sm">No fim do descanso.</div></div>${tog('vib',s.vib)}</div><div class="toggle"><div><b>Som</b><div class="mut sm">Aviso de conclusão.</div></div>${tog('sound',s.sound)}</div><div class="toggle"><div><b>Manter tela ligada</b><div class="mut sm">Durante o treino.</div></div>${tog('screen',s.screen)}</div></div><div class="card"><label>Descanso padrão de novos exercícios (s)</label><input type="number" step="15" value="${s.rest}" onchange="S.settings.rest=Math.max(15,+this.value||90);save()"><div class="actions"><button class="btn pri" onclick="notify()">Ativar notificações</button><button class="btn ghost" onclick="notifSettings()">Configurar Android</button></div></div><div class="title"><h3>Backup</h3></div><div class="card"><button class="btn pri full" onclick="backup()">Compartilhar backup</button><label>Restaurar backup JSON</label><input id="file" type="file" accept=".json,text/plain,application/json" onchange="restore(this.files[0])"><button class="btn danger full" style="margin-top:14px" onclick="resetAll()">Apagar todos os dados</button></div><div class="mut sm" style="text-align:center">Gym • versão ${native()?GymNative.version():'web'} • funciona offline</div>`}function notify(){if(native())GymNative.requestNotificationPermission()}function notifSettings(){if(native())GymNative.openNotificationSettings()}function backup(){let x=JSON.stringify({app:'Gym',version:1,date:new Date().toISOString(),state:S},null,2);if(native())GymNative.shareBackup(x)}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result).state||JSON.parse(r.result);if(!x.workouts||!x.history)throw 0;if(!confirm('Substituir dados atuais?'))return;S=Object.assign(defaults(),x,{settings:Object.assign(defaults().settings,x.settings||{}),active:null});save();settings();msg('Backup restaurado')}catch(e){alert('Backup inválido')}};r.readAsText(f)}function resetAll(){if(confirm('Apagar TODOS os dados do Gym?')&&confirm('Tem certeza?')){S=defaults();save();settings()}}
function rest(sec,label){if(native())GymNative.startTimer(sec,label,S.settings.vib,S.settings.sound);msg('Descanso '+ftime(sec))}function poll(){if(!native())return;try{timer=JSON.parse(GymNative.getTimerState());q('#timer').classList.toggle('on',timer.active);if(timer.active){q('#tl').textContent=timer.label;q('#tc').textContent=ftime(timer.remainingMs/1000);q('#tp').textContent=timer.running?'Pausar':'Continuar'}}catch(e){}}function addTime(s){if(native())GymNative.addTimer(s)}function pauseResume(){if(!native())return;timer.running?GymNative.pauseTimer():GymNative.resumeTimer()}function cancelTimer(){if(native())GymNative.cancelTimer();q('#timer').classList.remove('on')}setInterval(poll,400);go('home');poll();
</script></body></html>
